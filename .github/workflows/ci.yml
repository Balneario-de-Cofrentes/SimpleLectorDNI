name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-26
            package: sh
            validate_docs: "true"
          - name: macOS Intel
            os: macos-15-intel
            package: sh
            validate_docs: "false"
          - name: Windows x64
            os: windows-2025
            package: powershell
            validate_docs: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: ./.github/actions/build-and-package
        with:
          package: ${{ matrix.package }}
          artifact-name: ${{ matrix.name }}
          validate-docs: ${{ matrix.validate_docs }}

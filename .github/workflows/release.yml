name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-26
            package: sh
            validate_docs: "true"
          - name: macos-x64
            os: macos-15-intel
            package: sh
            validate_docs: "false"
          - name: windows-x64
            os: windows-2025
            package: powershell
            validate_docs: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: ./.github/actions/build-and-package
        with:
          package: ${{ matrix.package }}
          artifact-name: ${{ matrix.name }}
          validate-docs: ${{ matrix.validate_docs }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TEMURIN_SOURCE_FILE: OpenJDK21U-jdk-sources_21.0.12.1_1.tar.gz
      TEMURIN_SOURCE_SHA256: 573057d03584ae793fb7ec9a14c76d826d9187a53efeefd99da47403a5308234
      TEMURIN_SOURCE_URL: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk-sources_21.0.12.1_1.tar.gz
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Download corresponding Temurin source
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "dist/$TEMURIN_SOURCE_FILE" \
            "$TEMURIN_SOURCE_URL"
          printf '%s  %s\n' \
            "$TEMURIN_SOURCE_SHA256" \
            "dist/$TEMURIN_SOURCE_FILE" | sha256sum --check -

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip "$TEMURIN_SOURCE_FILE" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            *.zip "$TEMURIN_SOURCE_FILE" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "SimpleLectorDNI $GITHUB_REF_NAME" \
            --generate-notes

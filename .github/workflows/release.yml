name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-26
            package: sh
          - name: macos-x64
            os: macos-15-intel
            package: sh
          - name: windows-x64
            os: windows-2025
            package: powershell

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Package macOS
        if: matrix.package == 'sh'
        run: scripts/package-release.sh

      - name: Package Windows
        if: matrix.package == 'powershell'
        shell: pwsh
        run: scripts/package-release.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "SimpleLectorDNI $GITHUB_REF_NAME" \
            --generate-notes

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-26
            package: sh
          - name: macos-x64
            os: macos-15-intel
            package: sh
          - name: windows-x64
            os: windows-2025
            package: powershell

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version-file: ".java-version"
          cache: maven

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: command -v rg >/dev/null || brew install ripgrep

      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep --yes --no-progress
          }

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Validate privacy guardrails
        if: runner.os != 'Windows'
        run: scripts/check-no-biometric-access.sh && scripts/check-docs-and-privacy.sh

      - name: Validate privacy guardrails on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/check-no-biometric-access.sh

      - name: Package macOS
        if: matrix.package == 'sh'
        run: scripts/package-release.sh

      - name: Package Windows
        if: matrix.package == 'powershell'
        shell: pwsh
        run: scripts/package-release.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TEMURIN_SOURCE_FILE: OpenJDK21U-jdk-sources_21.0.12.1_1.tar.gz
      TEMURIN_SOURCE_SHA256: 573057d03584ae793fb7ec9a14c76d826d9187a53efeefd99da47403a5308234
      TEMURIN_SOURCE_URL: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk-sources_21.0.12.1_1.tar.gz
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Download corresponding Temurin source
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "dist/$TEMURIN_SOURCE_FILE" \
            "$TEMURIN_SOURCE_URL"
          printf '%s  %s\n' \
            "$TEMURIN_SOURCE_SHA256" \
            "dist/$TEMURIN_SOURCE_FILE" | sha256sum --check -

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip "$TEMURIN_SOURCE_FILE" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            *.zip "$TEMURIN_SOURCE_FILE" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "SimpleLectorDNI $GITHUB_REF_NAME" \
            --generate-notes

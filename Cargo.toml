[workspace]
members = ["crates/simple-lector-dni"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/balneariodecofrentes/SimpleLectorDNI"
rust-version = "1.85"

[workspace.dependencies]
atomic-write-file = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
url = "2.5"
uuid = { version = "1.0", features = ["serde", "v4"] }

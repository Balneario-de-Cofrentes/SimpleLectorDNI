[workspace]
members = ["crates/simple-lector-dni"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/Balneario-de-Cofrentes/SimpleLectorDNI"
rust-version = "1.88"

[workspace.dependencies]
atomic-write-file = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
pcsc = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls", "platform-verifier"] }
url = "2.5"
uuid = { version = "1.0", features = ["serde", "v4"] }
wait-timeout = "0.2"
